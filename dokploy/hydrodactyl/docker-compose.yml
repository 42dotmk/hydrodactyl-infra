# Hydrodactyl panel (https://github.com/BlueprintFramework/hydrodactyl).
# Managed by Pulumi (/root/hydrodactyl-infra/dokploy) - edit here, not in the Dokploy UI.
# ${VARS} come from the .env Dokploy writes from the Pulumi-managed environment.
#
# Service names are prefixed because the panel also joins dokploy-network,
# where generic names like "database" or "cache" could resolve to other stacks.
services:
  hydrodactyl-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: panel
      MARIADB_USER: hydrodactyl
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  hydrodactyl-redis:
    image: redis:7.4-alpine
    restart: unless-stopped

  hydrodactyl-panel:
    image: ${HYDRODACTYL_IMAGE}
    restart: unless-stopped
    # memory_limit is -1 below (PHP2Shell mitigation), so cap the container instead.
    mem_limit: 1536m
    # --- PHP2Shell (CVE-2026-109618 / CVE-2026-109619) interim hardening, 2026-10-21 ---------------
    # The image ships PHP 8.4.25; fixed in 8.4.27. Remove the configs and the hydrodactyl-lan-only
    # labels below once HYDRODACTYL_IMAGE is built on PHP >= 8.4.27 (check: docker exec ... php -v).
    configs:
      - source: php-fpm-pool
        target: /usr/local/etc/php-fpm.conf
      - source: php-hardening
        target: /usr/local/etc/php/conf.d/zz-hardening.ini
    labels:
      # LAN-only until patched: a higher-priority router than Dokploy's for the same host, with an
      # IP allowlist. Requests reach Traefik via Caddy on base42, which sets X-Forwarded-For to the
      # real client (it does not trust client-sent values); office clients and wings-01 arrive via the
      # MikroTik hairpin NAT as 192.168.100.1.
      - traefik.http.routers.hydrodactyl-lan-only.rule=Host(`hydrodactyl.apps.42.mk`)
      - traefik.http.routers.hydrodactyl-lan-only.entrypoints=web
      - traefik.http.routers.hydrodactyl-lan-only.priority=10000
      - traefik.http.routers.hydrodactyl-lan-only.middlewares=hydrodactyl-lan-only
      - traefik.http.routers.hydrodactyl-lan-only.service=hydrodactyl-lan-only
      - traefik.http.services.hydrodactyl-lan-only.loadbalancer.server.port=80
      - traefik.http.middlewares.hydrodactyl-lan-only.ipallowlist.sourcerange=192.168.100.0/23
      - traefik.http.middlewares.hydrodactyl-lan-only.ipallowlist.ipstrategy.depth=1
    depends_on:
      hydrodactyl-db:
        condition: service_healthy
      hydrodactyl-redis:
        condition: service_started
    # Healthy only once the entrypoint has finished migrations and nginx is serving.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    volumes:
      # APP_KEY and HASHIDS_SALT are generated on first start into /app/var/.env.
      # Losing this volume makes encrypted panel data unreadable - back it up.
      - var:/app/var
      - logs:/app/storage/logs
      - storage:/app/storage/app/public
    environment:
      APP_ENV: production
      APP_ENVIRONMENT_ONLY: "false"
      APP_URL: ${APP_URL}
      APP_TIMEZONE: ${APP_TIMEZONE}
      APP_SERVICE_AUTHOR: ${APP_SERVICE_AUTHOR}
      # TLS ends at Caddy on base42; Traefik forwards plain HTTP.
      TRUSTED_PROXIES: "*"
      DB_CONNECTION: mariadb
      DB_HOST: hydrodactyl-db
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: hydrodactyl
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: hydrodactyl-redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      QUEUE_CONNECTION: redis
      HASHIDS_LENGTH: "8"

  # One-shot gate: `docker compose up -d` (and so Dokploy's deploy status) only finishes once the
  # panel is healthy, i.e. first-boot migrations are done. Recreating the panel mid-migration
  # leaves MariaDB half-migrated, because DDL is not transactional.
  hydrodactyl-ready:
    image: redis:7.4-alpine
    command: ["true"]
    restart: "no"
    depends_on:
      hydrodactyl-panel:
        condition: service_healthy

configs:
  # Hydrodactyl's own pool definition (/usr/local/etc/php-fpm.conf in the image, which does not
  # include php-fpm.d/) plus php_admin_* values that applications cannot override with ini_set().
  php-fpm-pool:
    content: |
      [www]
      user = nginx
      group = nginx
      listen = 127.0.0.1:9000
      listen.owner = nginx
      listen.group = nginx
      listen.mode = 0750
      pm = ondemand
      pm.max_children = 9
      pm.process_idle_timeout = 10s
      pm.max_requests = 200
      clear_env = no
      php_admin_flag[session.upload_progress.enabled] = off
      php_admin_value[memory_limit] = -1
      php_admin_value[post_max_size] = 8M
  php-hardening:
    content: |
      expose_php = Off
      session.upload_progress.enabled = 0

volumes:
  database:
  var:
  logs:
  storage:
